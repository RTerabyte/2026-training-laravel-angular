<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">T</div>

      <div class="sidebar-brand">
        <h2>TPV</h2>
        <p>Yurest</p>
      </div>
    </div>

    <ion-button
      class="nav-button"
      fill="clear"
      [class.active]="isRouteActive('tables')"
      (click)="goToTables()"
    >
      Mesas
    </ion-button>

    <ion-button
      *ngIf="isAdmin()"
      class="nav-button"
      fill="clear"
      [class.active]="isRouteActive('sales')"
      (click)="goToSales()"
    >
      Ventas
    </ion-button>

    <ion-button
      *ngIf="isAdmin()"
      class="nav-button"
      fill="clear"
      [class.active]="isRouteActive('settings')"
      (click)="goToSettings()"
    >
      Ajustes
    </ion-button>

    <div class="spacer"></div>

    <ion-button class="theme-button" fill="clear" (click)="toggleTheme()">
      <ion-icon [name]="isDarkTheme ? 'sunny' : 'moon'"></ion-icon>
    </ion-button>

    <div class="user-block" *ngIf="user">
      <div class="user-card">
        <div class="user-avatar">
          {{ user.name ? user.name.charAt(0).toUpperCase() : "A" }}
        </div>

        <div class="user-info">
          <div class="user-name">{{ user.name }}</div>
          <div class="user-role">
            {{ isAdmin() ? "Administrador" : "Empleado" }}
          </div>
        </div>
      </div>

      <ion-button class="logout-button" fill="clear" (click)="logout()">
        Salir
      </ion-button>
    </div>
  </div>

  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
