<ion-content class="ion-padding">
  <h2>Pedido abierto</h2>

  <div
    class="empty-order-actions"
    *ngIf="!isLoading && currentOrder && orderLines.length === 0"
  >
    <div>
      <strong>Mesa sin productos</strong>
      <p>Si los comensales se han ido sin pedir, puedes liberar la mesa.</p>
    </div>

    <button
      type="button"
      class="release-table-button"
      (click)="openCancelOrderModal()"
    >
      Liberar mesa
    </button>
  </div>

  <p *ngIf="isLoading">Cargando pedido...</p>

  <div class="orders-layout" *ngIf="!isLoading">
    <app-order-products
      [products]="products"
      [families]="families"
      (productSelected)="addProduct($event)"
    ></app-order-products>

    <app-order-summary
      [orderLines]="orderLines"
      [isSentToKitchen]="isSentToKitchen"
      [sentLineIds]="sentLineIds"
      (increaseLine)="increaseLine($event)"
      (decreaseLine)="decreaseLine($event)"
      (deleteLine)="deleteLine($event)"
      (sendToKitchen)="sendToKitchen()"
      (checkout)="checkout()"
      (openPrebill)="openPrebill()"
    ></app-order-summary>
  </div>

  <app-payment-modal
    *ngIf="showPaymentModal"
    [total]="getOrderTotal()"
    (closed)="showPaymentModal = false"
    (paymentConfirmed)="confirmPayment($event)"
  ></app-payment-modal>

  <app-prebill-modal
    *ngIf="showPrebillModal"
    [orderLines]="orderLines"
    [tableName]="tableName"
    [openedAt]="currentOrder?.opened_at ?? null"
    (closed)="showPrebillModal = false"
  ></app-prebill-modal>

  <app-final-ticket-modal
    *ngIf="showFinalTicketModal"
    [orderLines]="orderLines"
    [payments]="finalTicketPayments"
    [tableName]="tableName"
    [openedAt]="currentOrder?.opened_at ?? null"
    (closed)="goBackToTables()"
  ></app-final-ticket-modal>

  <div
    class="cancel-order-backdrop"
    *ngIf="showCancelOrderModal"
    (click)="closeCancelOrderModalFromBackdrop($event)"
  >
    <div class="cancel-order-modal" (click)="$event.stopPropagation()">
      <div class="cancel-order-header">
        <span>Liberar mesa</span>

        <button type="button" (click)="closeCancelOrderModal()">×</button>
      </div>

      <h2>¿Cancelar pedido?</h2>

      <p>
        Esta mesa no tiene productos añadidos. Si continúas, el pedido se
        marcará como cancelado y la mesa volverá a estar libre.
      </p>

      <div class="cancel-order-actions">

        <button
          type="button"
          class="danger-button"
          (click)="$event.stopPropagation(); confirmCancelOrder()"
        >
          Liberar mesa
        </button>
      </div>
    </div>
  </div>
</ion-content>
