<div class="products-section">
  <div class="products-header">
    <h3>Productos</h3>
    <p>Selecciona productos para añadirlos al pedido</p>
  </div>

  <div class="families-list">
    <ion-button
      class="family-button"
      size="small"
      fill="clear"
      [class.active]="selectedFamilyId === null"
      (click)="selectFamily(null)"
    >
      Todas
    </ion-button>

    <ion-button
      *ngFor="let family of families"
      class="family-button"
      size="small"
      fill="clear"
      [class.active]="selectedFamilyId === family.id"
      (click)="selectFamily(family.id)"
    >
      {{ family.name }}
    </ion-button>
  </div>

  <div *ngFor="let family of getVisibleFamilies()" class="family-section">
    <div class="family-title">
      <h4>{{ family.name }}</h4>
      <span>{{ getProductsByFamily(family.id).length }} productos</span>
    </div>

    <div class="products-grid">
      <ion-card
        *ngFor="let product of getProductsByFamily(family.id)"
        class="product-card"
        (click)="productSelected.emit(product)"
      >
        <div class="product-image-box">
          <img
            *ngIf="product.image_src; else noImage"
            class="product-image"
            [src]="product.image_src"
            [alt]="product.name"
          />

          <ng-template #noImage>
            <div class="product-placeholder">🍽️</div>
          </ng-template>
        </div>
        <ion-card-content>
          <div class="product-info">
            <h5>{{ product.name }}</h5>
            <span class="product-price">
              {{ product.price / 100 | number: "1.2-2" }} €
            </span>
          </div>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</div>
