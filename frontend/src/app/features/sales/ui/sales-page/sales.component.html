<ion-content class="ion-padding">
  <div class="sales-header">
    <div>
      <h2>Ventas</h2>
      <p>Listado de ventas cerradas</p>
    </div>

    <ion-button fill="outline" (click)="loadSales()">Actualizar</ion-button>
  </div>

  <p *ngIf="isLoading">Cargando ventas...</p>

  <div *ngIf="!isLoading && sales.length === 0" class="empty-state">
    No hay ventas registradas todavía.
  </div>

  <div *ngIf="!isLoading && sales.length > 0" class="sales-table">
    <div class="sales-row sales-row-header">
      <span>Ticket</span>
      <span>Fecha</span>
      <span>Usuario</span>
      <span>Total</span>
    </div>

    <div *ngFor="let sale of sales" class="sales-row">
      <span>#{{ sale.ticket_number || '-' }}</span>
      <span>{{ formatDate(sale.value_date) }}</span>
      <span>{{ sale.user_id }}</span>
      <strong>{{ sale.total / 100 | number: '1.2-2' }} €</strong>
    </div>
  </div>
</ion-content>
